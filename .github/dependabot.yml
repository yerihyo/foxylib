# Dependabot 버전 업데이트 설정 (foxylib).
#
# foxylib 은 cakeaholic 의 `backend/foxylib` submodule 로 **소스 소비**된다 (pip 설치 아님).
#   판정은 cakeaholic 쪽 대장에서 함께 한다:
#   cakeaholic `doc/security-alerts/README.md` / `ledger.jsonl` (key 접두사 `foxylib#`)
#
# 2026-09-23 이전에는 이 리포의 alert 를 **아무도 보지 않았다** — setup.py 한 파일에 37건이
#   쌓여 있었고(critical 1, high 19), 그게 그대로 cakeaholic 의 의존성이기도 했다.
#   같은 날 install_requires 를 「cakeaholic 이 실제로 import 하는 것」만 남기도록 정리해
#   37 → 1건(pymongo)이 됐다. 이 파일은 그 상태가 다시 벌어지지 않게 한다.
#
# 대상은 setup.py 하나뿐이다 (requirements.txt·lockfile 없음).

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # 이 셋은 cakeaholic 과 맞춰서 올려야 한다 — 여기서 단독으로 올리면 실제와 어긋난다
      - dependency-name: "flask"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pymongo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    groups:
      actions-all:
        patterns: ["*"]
