# Dependabot 버전 업데이트 설정 (foxylib).
#
# foxylib 은 cakeaholic 의 `backend/foxylib` submodule 로 **소스 소비**된다 (pip 설치 아님).
#   판정은 cakeaholic 쪽 대장에서 함께 한다:
#   cakeaholic `doc/security-alerts/README.md` / `ledger.jsonl` (key 접두사 `foxylib#`)
#
# 2026-09-23 이전에는 이 리포의 alert 를 **아무도 보지 않았다** — setup.py 한 파일에 37건이
#   쌓여 있었고(critical 1, high 19), 그게 그대로 cakeaholic 의 의존성이기도 했다.
#   같은 날 install_requires 를 「cakeaholic 이 실제로 import 하는 것」만 남기도록 정리해
#   37 → 1건(pymongo)이 됐다. 이 파일은 그 상태가 다시 벌어지지 않게 한다.
#
# 대상은 setup.py 하나뿐이다 (requirements.txt·lockfile 없음).

# ⚠️ 현재 **버전 업데이트 PR 은 꺼져 있다** (모든 블록 open-pull-requests-limit: 0).
#
# 왜: 이 설정이 처음 가동되자 밀려 있던 major 까지 PR 13개가 한꺼번에 열렸고,
#   그 PR 들이 pr-test.yaml 을 트리거해 Actions 분을 실제로 먹었다. 더 큰 이유는,
#   2026-09-23 에 취약점 208 → 0 을 만든 수단이 **하나도 Dependabot PR 로 해결되지 않았다**는 점이다
#   (foxylib submodule 전환 / cakelib peerDependencies / yarn resolutions / undici 두 갈래 /
#    tiptap v2→v3 코드 수정 / pymongo 3→4) — 전부 사람의 판단이 필요했다.
#
# 대신 이렇게 관리한다:
#   - Dependabot **alerts**(취약점 목록)는 이 파일과 무관하게 계속 쌓인다
#   - `scripts/github/security_alerts.bash` + `doc/security-alerts/ledger.jsonl` 이 판정을 기록하고,
#     `security-alerts.yaml` 이 주간으로 «미판정 신규만» 띄운다
#   - Dependabot **security updates**(취약점 고치는 PR)는 리포 Settings 소관이라 여기서 못 끈다 — 지켜보는 중
#
# 아래 ecosystem/directory/groups/ignore 설정은 다시 켤 때를 위해 그대로 둔다.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    # ⚠️ 0 = **버전 업데이트 PR 을 만들지 않는다** (2026-09-23).
    #   공식 문서: "You can temporarily disable version updates for a package manager
    #   by setting this option to zero." 되살리려면 이 값을 양수로 바꾸면 된다.
    open-pull-requests-limit: 0
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ── major 는 정기 PR 로 받지 않는다 ──────────────────────────────────────────
      #   이 리포는 Dependabot 이 처음 가동되면서 밀려 있던 major 가 한꺼번에 쏟아졌다
      #   (2026-09-23: undici→8, ajv→8, nodemailer→10, numpy→2, arrow 0.15→1.4 ...).
      #   major 는 API 가 바뀌어 사람이 계획해서 올려야 하므로 정기 PR 에서 뺀다.
      #
      #   **보안 업데이트는 이 설정에 영향받지 않는다** — 공식 문서: "update-types only
      #   affects version updates, not security updates". major 로만 고쳐지는 취약점도 PR 이 온다.
      #   (`allow` 로 minor/patch 만 허용하는 방식은 지정 안 한 의존성이 통째로 대상에서
      #    빠져 「검사 안 하는」 구멍이 생기므로 쓰지 않는다)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    # ⚠️ 0 = **버전 업데이트 PR 을 만들지 않는다** (2026-09-23).
    #   공식 문서: "You can temporarily disable version updates for a package manager
    #   by setting this option to zero." 되살리려면 이 값을 양수로 바꾸면 된다.
    open-pull-requests-limit: 0
    groups:
      actions-all:
        patterns: ["*"]
    ignore:
      # major 는 정기 PR 로 받지 않는다 — API 가 바뀌어 사람이 계획해서 올려야 한다.
      #   **보안 업데이트는 영향 없음** (공식 문서: "update-types only affects version updates,
      #   not security updates") — major 로만 고쳐지는 취약점도 PR 이 온다.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
